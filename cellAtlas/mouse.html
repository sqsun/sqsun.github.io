  <div id="organ-tooltip" class="custom-tooltip" aria-hidden="true" hidden></div>
  <script>
    const tooltip = document.querySelector('#organ-tooltip');
    const highlightLayers = document.querySelectorAll('[data-highlight-for]');
    let activeLabel = null;

    function positionTooltip(x, y) {
      const margin = 8;
      const left = Math.max(margin, Math.min(x + 12, window.innerWidth - tooltip.offsetWidth - margin));
      const above = y - tooltip.offsetHeight - margin;
      tooltip.style.left = left + 'px';
      tooltip.style.top = (above >= margin ? above : y + margin) + 'px';
    }

    function showOrgan(label, x, y) {
      activeLabel = label;
      for (const layer of highlightLayers) {
        layer.classList.toggle('is-highlighted', layer.dataset.highlightFor === label.dataset.organ);
      }
      tooltip.textContent = 'About ' + label.querySelector('text').textContent + ' Information';
      tooltip.hidden = false;
      positionTooltip(x, y);
    }

    function hideOrgan(label) {
      if (activeLabel !== label) return;
      activeLabel = null;
      for (const layer of highlightLayers) {
        layer.classList.remove('is-highlighted');
      }
      tooltip.hidden = true;
    }

    for (const label of document.querySelectorAll('.organ-label')) {
      label.addEventListener('pointerenter', (event) => {
        if (event.pointerType !== 'touch') showOrgan(label, event.clientX, event.clientY);
      });
      label.addEventListener('pointermove', (event) => {
        if (activeLabel === label && !tooltip.hidden) positionTooltip(event.clientX, event.clientY);
      });
      label.addEventListener('pointerleave', () => {
        if (!label.matches(':focus-visible')) hideOrgan(label);
      });
      label.addEventListener('focus', () => {
        if (!label.matches(':focus-visible')) return;
        const bounds = label.querySelector('text').getBoundingClientRect();
        showOrgan(label, bounds.left, bounds.top);
      });
      label.addEventListener('blur', () => {
        if (!label.matches(':hover')) hideOrgan(label);
      });
      label.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') hideOrgan(label);
      });
    }
  </script>
